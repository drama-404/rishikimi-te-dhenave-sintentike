<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rishikimi i të Dhënave Sintetike</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f5;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #16202a;
      --muted: #6a7787;
      --line: #dde3ea;
      --line-2: #eef1f5;
      --accent: #1f6feb;
      --accent-dark: #174ea6;
      --low: #c2410c;
      --mid: #a16207;
      --high: #15803d;
      --shadow: 0 10px 30px rgba(22, 32, 42, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #f4f7fb, var(--bg));
      color: var(--text);
      font: 13.5px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell { width: min(740px, calc(100vw - 24px)); margin: 0 auto; padding: 18px 0 32px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -0.2px; }
    .syn-note { margin-top: 2px; font-size: 11px; color: var(--muted); }
    .controls { display: flex; align-items: center; gap: 8px; }
    select, .btn {
      height: 32px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel); color: var(--text); font: inherit;
    }
    select { padding: 0 26px 0 9px; cursor: pointer; }
    .btn { cursor: pointer; padding: 0 11px; font-weight: 600; color: var(--muted); }
    .btn:hover { border-color: var(--accent); color: var(--text); }
    #resetSeen:hover { border-color: var(--low); color: var(--low); background: rgba(194, 65, 12, 0.06); }

    .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
    .bar { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #4f9bff); transition: width .25s ease; }
    .progress b { color: var(--text); font-weight: 700; }

    .stage { display: grid; grid-template-columns: 40px 1fr 40px; align-items: stretch; gap: 10px; }
    .nav {
      width: 40px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); color: var(--muted); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
    }
    .nav:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .nav:disabled { opacity: .35; cursor: default; }

    .card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    .id { font-weight: 800; font-size: 14px; }
    .arch { padding: 2px 9px; border-radius: 999px; background: #eaf2ff; color: var(--accent-dark); font-size: 11.5px; font-weight: 650; white-space: nowrap; }
    .conf { font-size: 11px; color: var(--muted); }
    .spacer { flex: 1; }
    .done { height: 30px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; transition: background .12s, border-color .12s; }
    .done:hover { background: var(--accent-dark); }
    .done.marked { background: var(--high); border-color: var(--high); cursor: default; }

    .results { margin: 12px 12px 14px; border: 1px solid rgba(31, 111, 235, 0.28); border-radius: 9px; overflow: hidden; }
    .results-head { display: flex; align-items: baseline; gap: 8px; padding: 5px 10px; background: rgba(31, 111, 235, 0.08); border-bottom: 1px solid rgba(31, 111, 235, 0.18); }
    .results-head b { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--accent-dark); }
    .results-head small { font-size: 10px; color: var(--muted); }
    .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
    .score { padding: 7px 10px; background: var(--panel); text-align: center; }
    .score b { display: block; font-size: 10px; color: var(--muted); font-weight: 650; }
    .score span { font-size: 17px; font-weight: 800; }

    .section-title { padding: 10px 12px 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 2px 12px 6px; }
    .demo { min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
    .demo b { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
    .demo b i { color: var(--accent-dark); font-style: normal; font-weight: 700; }
    .demo span { font-size: 12.5px; font-weight: 550; overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .chip { padding: 2px 8px; border-radius: 999px; background: rgba(31, 111, 235, 0.07); border: 1px solid rgba(31, 111, 235, 0.16); color: var(--accent-dark); font-size: 11px; }

    /* ---- MS-Forms-style Likert matrix ---- */
    .matrix { margin: 4px 12px 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .matrix-title { padding: 6px 9px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 11.5px; font-weight: 700; }
    .matrix-title small { display: block; font-weight: 500; color: var(--muted); font-size: 10px; margin-top: 1px; }
    .mrow { display: grid; grid-template-columns: 1fr repeat(5, 50px); align-items: center; }
    .mrow + .mrow { border-top: 1px solid var(--line-2); }
    .mhrow { background: #fbfcfe; border-bottom: 1px solid var(--line); }
    .mhead { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 1px; }
    .mhead small { display: block; font-size: 8px; font-weight: 500; line-height: 1.05; margin-top: 1px; }
    .mhcorner { padding-left: 9px; font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .mstmt { font-size: 11px; color: #34404c; padding: 5px 9px; line-height: 1.25; }
    .mstmt b { color: var(--muted); font-weight: 700; margin-right: 3px; }
    .mcell { display: flex; align-items: center; justify-content: center; padding: 4px 0; }
    .radio { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #cfd6df; background: #fff; }
    .radio.sel { border-color: transparent; box-shadow: 0 0 0 2px rgba(0,0,0,.04); }
    .radio.sel.low { background: var(--low); }
    .radio.sel.mid { background: var(--mid); }
    .radio.sel.high { background: var(--high); }
    .dup { padding: 4px 12px 0; font-size: 10px; color: var(--muted); font-style: italic; }

    .comment { margin: 4px 12px 14px; padding: 8px 10px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--panel-2); font-size: 12.5px; color: #34404c; }
    .comment.empty { color: var(--muted); font-style: italic; }

    .empty { display: none; padding: 40px 20px; text-align: center; color: var(--muted); }
    .empty.visible { display: block; }
    .empty strong { display: block; font-size: 15px; color: var(--text); margin-bottom: 4px; }

    .hint { margin-top: 10px; text-align: center; font-size: 11px; color: var(--muted); }
    kbd { padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel); font: inherit; font-size: 10.5px; }

    @media (max-width: 560px) {
      .stage { grid-template-columns: 30px 1fr 30px; gap: 6px; }
      .nav { width: 30px; font-size: 17px; }
      .demos { grid-template-columns: repeat(2, 1fr); }
      .mrow { grid-template-columns: 1fr repeat(5, 34px); }
      .mhead { font-size: 11px; }
      .mhead small { display: none; }
      .radio { width: 14px; height: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Rishikimi i të Dhënave Sintetike</h1>
        <div class="syn-note">Të dhëna sintetike të deklaruara — vetëm për simulim / trajnim ML.</div>
      </div>
      <div class="controls">
        <select id="archetypeFilter" aria-label="Filtri i arketipit">
          <option value="all">Të gjitha arketipet</option>
        </select>
        <button class="btn" id="resetSeen" type="button">Rivendos</button>
      </div>
    </header>

    <div class="progress">
      <span><b id="position">0</b> / <span id="visibleCount">0</span></span>
      <span class="bar"><i id="barFill"></i></span>
      <span><b id="completedCount">0</b> të rishikuara · <span id="totalCount">0</span> gjithsej</span>
    </div>

    <div class="stage">
      <button class="nav" id="prevBtn" type="button" aria-label="I mëparshmi">‹</button>
      <div id="cardSlot"><section class="empty" id="emptyState"><strong>Duke ngarkuar…</strong></section></div>
      <button class="nav" id="nextBtn" type="button" aria-label="Pasardhësi">›</button>
    </div>

    <div class="hint">
      <kbd>←</kbd> <kbd>→</kbd> për të lëvizur · <kbd>D</kbd> shënoje si të rishikuar
    </div>
  </main>

  <script>
    const STORAGE_KEY = "survey-review-completed-v1";
    const DATA_URL = "output/synthetic_records.json";

    const likertCols = ["Nuk pajtohem aspak", "Nuk pajtohem", "Neutral", "Pajtohem", "Pajtohem plotesisht"];

    // Archetype display names (data values stay as-is for filtering).
    const archNames = {
      "Early Adopter": "Adoptues i hershëm",
      "Cautious User": "Përdorues i kujdesshëm",
      "Traditionalist": "Tradicionalist",
      "Professional / Expert": "Profesionist / Ekspert"
    };
    const archLabel = a => archNames[a] || a;

    // Demographic cells in form order: [code, label, getter].
    // Q10 (multiple choice) is rendered separately as chips in its own position.
    const demoBefore = [
      ["Q1", "Pëlqimi", r => r.answers.Q1_consent],
      ["Q2", "Gjinia", r => r.answers.Q2_gender],
      ["Q3", "Mosha", r => r.answers.Q3_age],
      ["Q4", "Arsimi", r => r.answers.Q4_education],
      ["Q5", "Punësimi", r => r.answers.Q5_employment],
      ["Q6", "Fusha", r => r.answers.Q6_field],
      ["Q7", "Vendbanimi", r => r.answers.Q7_location],
      ["Q8", "Banka", r => r.answers.Q8_bank],
      ["Q9", "Klient/e prej", r => r.answers.Q9_tenure]
    ];
    const demoAfter = [
      ["Q11", "Frekuenca digjitale", r => r.answers.Q11_digital_frequency],
      ["Q12", "Kënaqësia digjitale", r => String(r.answers.Q12_digital_satisfaction) + " / 5"],
      ["Q13", "Chatbot", r => r.answers.Q13_chatbot_interaction]
    ];

    // Likert matrices — statements EXACTLY as in the original form.
    // [code, title, blockKey, prefix, [[n, statement, itemKey], ...], dupNote?]
    const matrices = [
      ["Q14", "Sa pajtoheni me pohimet e meposhtme mbi inteligjencen artificiale (IA) ne banka?", "q14", "14", [
        [1, "Kam njohuri te mjaftueshme mbi inteligjencen artificiale dhe mundesite e saj", "q14_1_ai_knowledge"],
        [2, "Besoj se IA mund te permiresoje cilesine e sherbimeve bankare", "q14_2_service_quality"],
        [3, "Do te ndihesha rehat nese nje sistem IA do te vleresonte kerkesen time per kredi", "q14_3_ai_credit_eval"],
        [4, "Do te preferoja te nderveproja me nje chatbot IA per pyetje te thjeshta bankare", "q14_4_chatbot_preference"],
        [5, "Jam i/e shqetesuar per privatesine e te dhenave te mia nese banka perdor IA", "q14_5_privacy_concern"],
        [6, "Mendoj se IA do te zevendesoje shume nga punet aktuale ne banka", "q14_6_job_replacement"]
      ]],
      ["Q15", "Sa pajtoheni me pohimet e meposhtme mbi gatishmerine tuaj per te perdorur IA ne banka?", "q15", "15", [
        [1, "Jam i gatshem te perdor nje aplikacion bankar me rekomandime te personalizuara nga IA", "q15_1_personalized_app"],
        [2, "Besimi im ne bankat shqiptare do te rritej nese IA do te zbulonte mashtrimet ne llogarite e mia me shpejt", "q15_2_fraud_detection_trust"],
        [3, "Do te pranoja keshillim financiar te gjeneruar nga IA nese do te ishte falas", "q15_3_free_ai_advice"],
        [4, "Transparenca mbi menyren se si IA merr vendime eshte e rendesishme per mua", "q15_4_transparency"],
        [5, "Do te preferoja nje banke qe perdor IA per sherbime me te shpejta ndaj nje banke qe nuk e perdor", "q15_5_faster_ai_bank"],
        [6, "Do te ndihesha me i/e sigurt nese nje punonjes njerezor do te verifikonte vendimet e IA", "q15_6_human_verification"],
        [7, "Ne pergjithesi, jam gati te provoj sherbime bankare qe perdorin inteligjencen artificiale", "q15_7_overall_readiness"]
      ]],
      ["Q16", "Sa pajtoheni me pohimet e meposhtme mbi gatishmerine tuaj per te perdorur IA ne banka?", "q16", "16", [
        [1, "Jam i gatshem te perdor nje aplikacion bankar me rekomandime te personalizuara nga IA", "q16_1_personalized_app"],
        [2, "Besimi im ne bankat shqiptare do te rritej nese IA do te zbulonte mashtrimet ne llogarite e mia me shpejt", "q16_2_fraud_detection_trust"],
        [3, "Do te pranoja keshillim financiar te gjeneruar nga IA nese do te ishte falas", "q16_3_free_ai_advice"],
        [4, "Transparenca mbi menyren se si IA merr vendime eshte e rendesishme per mua", "q16_4_transparency"],
        [5, "Do te preferoja nje banke qe perdor IA per sherbime me te shpejta ndaj nje banke qe nuk e perdor", "q16_5_faster_ai_bank"],
        [6, "Do te ndihesha me i/e sigurt nese nje punonjes njerezor do te verifikonte vendimet e IA", "q16_6_human_verification"],
        [7, "Ne pergjithesi, jam gati te provoj sherbime bankare qe perdorin inteligjencen artificiale", "q16_7_overall_readiness"]
      ], "Q16 përsërit të njëjtat 7 pohime si Q15 në formularin origjinal (ruhet për përputhje skeme)."],
      ["Q17", "Sa pajtoheni me pohimet e meposhtme mbi shqetesimet tuaja per perdorimin e IA ne banka?", "q17", "17", [
        [1, "Mungesa e njohurive te mia mbi IA me pengon te perdor sherbime te tilla", "q17_1_lack_knowledge"],
        [2, "Kam frike se te dhenat e mia personale mund te keqperdoren nese banka perdor IA", "q17_2_data_misuse"],
        [3, "Preferoj te flas me nje njeri, jo me nje robot, kur kam ceshtje bankare", "q17_3_human_preference"],
        [4, "Nuk besoj se IA mund te marre vendime te sakta financiare", "q17_4_inaccurate_decisions"],
        [5, "Kostot e mundshme shtese per sherbimet me IA me shqetesojne", "q17_5_extra_costs"]
      ]]
    ];

    let records = [];
    let completed = loadCompleted();
    let view = [];
    let index = 0;
    let marking = false;

    function loadCompleted() {
      try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").map(String)); }
      catch { return new Set(); }
    }
    function saveCompleted() { localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed])); }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }
    const band = v => v <= 2 ? "low" : v === 3 ? "mid" : "high";

    function demoHtml(record) {
      const cell = ([code, label, getter]) =>
        `<div class="demo"><b><i>${code}</i> · ${escapeHtml(label)}</b><span>${escapeHtml(getter(record))}</span></div>`;
      const before = demoBefore.map(cell).join("");
      const after = demoAfter.map(cell).join("");
      const services = (record.answers.Q10_digital_services || [])
        .map(s => `<span class="chip">${escapeHtml(s)}</span>`).join("");
      const q10 = `<div class="demo" style="grid-column:1/-1">
          <b><i>Q10</i> · Shërbime digjitale</b>
          <div class="chips">${services || '<span class="chip">—</span>'}</div>
        </div>`;
      return `<div class="demos">${before}${q10}${after}</div>`;
    }

    function matrixHtml(record, [code, title, blockKey, prefix, items, dupNote]) {
      const block = record.answers.likert_blocks[blockKey];
      const header = `<div class="mrow mhrow">
        <div class="mhcorner">Pohimi</div>
        ${likertCols.map((c, i) => `<div class="mhead">${i + 1}<small>${escapeHtml(c)}</small></div>`).join("")}
      </div>`;
      const rows = items.map(([n, stmt, key]) => {
        const v = block[key];
        const cells = [1, 2, 3, 4, 5].map(opt =>
          `<div class="mcell"><span class="radio ${opt === v ? "sel " + band(v) : ""}"></span></div>`
        ).join("");
        return `<div class="mrow" title="${escapeHtml(stmt)}: ${v} - ${escapeHtml(likertCols[v - 1])}">
          <div class="mstmt"><b>${prefix}.${n}</b>${escapeHtml(stmt)}</div>${cells}
        </div>`;
      }).join("");
      return `<div class="matrix">
        <div class="matrix-title">${code} · ${escapeHtml(title)}${dupNote ? `<small>${escapeHtml(dupNote)}</small>` : ""}</div>
        ${header}${rows}
      </div>`;
    }

    function cardHtml(record) {
      const id = String(record.metadata.id);
      const s = record.scores;
      const conf = record.validation && typeof record.validation.confidence === "number"
        ? `siguria ${record.validation.confidence.toFixed(2)}` : "";
      const comment = (record.answers.Q18_comment || "").trim();
      return `
        <section class="card">
          <div class="card-head">
            <span class="id">#${escapeHtml(id)}</span>
            <span class="arch">${escapeHtml(archLabel(record.metadata.archetype))}</span>
            <span class="conf">${escapeHtml(conf)}</span>
            <span class="spacer"></span>
            <button class="done" id="doneBtn" type="button">Rishikuar ✓</button>
          </div>
          <div class="section-title">Profili demografik</div>
          ${demoHtml(record)}
          <div class="section-title">Matricat Likert (Q14–Q17)</div>
          ${matrices.map(m => matrixHtml(record, m)).join("")}
          <div class="section-title">Q18 · Koment</div>
          <div class="comment ${comment ? "" : "empty"}">${comment ? escapeHtml(comment) : "Pa koment"}</div>
          <div class="results">
            <div class="results-head"><b>Rezultatet</b><small>vlera të llogaritura, jo përgjigje</small></div>
            <div class="scores">
              <div class="score"><b>Dobia e perceptuar</b><span class="${band(Math.round(s.perceived_usefulness))}">${s.perceived_usefulness.toFixed(2)}</span></div>
              <div class="score"><b>Gatishmëria</b><span class="${band(Math.round(s.adoption_readiness))}">${s.adoption_readiness.toFixed(2)}</span></div>
              <div class="score"><b>Barriera besim/privatësi</b><span class="${band(Math.round(s.trust_privacy_barrier))}">${s.trust_privacy_barrier.toFixed(2)}</span></div>
            </div>
          </div>
        </section>`;
    }

    function recomputeView(keepId) {
      const filter = document.getElementById("archetypeFilter").value;
      view = records.filter(r =>
        !completed.has(String(r.metadata.id)) &&
        (filter === "all" || r.metadata.archetype === filter)
      );
      if (keepId != null) {
        const found = view.findIndex(r => String(r.metadata.id) === String(keepId));
        if (found !== -1) index = found;
      }
      if (index >= view.length) index = view.length - 1;
      if (index < 0) index = 0;
    }

    function render() {
      const slot = document.getElementById("cardSlot");
      const total = records.length;
      const unseen = records.filter(r => !completed.has(String(r.metadata.id))).length;

      document.getElementById("completedCount").textContent = String(completed.size);
      document.getElementById("totalCount").textContent = String(total);
      document.getElementById("visibleCount").textContent = String(view.length);
      document.getElementById("position").textContent = String(view.length ? index + 1 : 0);
      document.getElementById("barFill").style.width = (view.length ? ((index + 1) / view.length) * 100 : 0) + "%";

      document.getElementById("prevBtn").disabled = index <= 0;
      document.getElementById("nextBtn").disabled = index >= view.length - 1;

      if (!view.length) {
        const allDone = unseen === 0 && total > 0;
        slot.innerHTML = `<section class="empty visible">
          <strong>${allDone ? "Të gjitha u rishikuan 🎉" : "S'ka të dhëna që përputhen"}</strong>
          ${allDone ? "Çdo respondent sintetik është rishikuar." : "Provoni një filtër tjetër ose shtypni Rivendos."}
        </section>`;
        return;
      }
      slot.innerHTML = cardHtml(view[index]);
      document.getElementById("doneBtn").addEventListener("click", markDone);
    }

    function markDone() {
      if (!view.length || marking) return;
      marking = true;
      const id = String(view[index].metadata.id);
      const btn = document.getElementById("doneBtn");
      if (btn) { btn.classList.add("marked"); btn.textContent = "U rishikua ✓"; btn.disabled = true; }
      // Brief green confirmation, then advance to the next unseen card.
      setTimeout(() => {
        completed.add(id);
        saveCompleted();
        recomputeView();
        marking = false;
        render();
      }, 260);
    }
    function go(delta) {
      const target = index + delta;
      if (target < 0 || target >= view.length) return;
      index = target;
      render();
    }

    function setupFilters() {
      const select = document.getElementById("archetypeFilter");
      [...new Set(records.map(r => r.metadata.archetype))].sort().forEach(a => {
        const opt = document.createElement("option");
        opt.value = a; opt.textContent = archLabel(a);
        select.appendChild(opt);
      });
      select.addEventListener("change", () => { index = 0; recomputeView(); render(); });
    }

    document.getElementById("prevBtn").addEventListener("click", () => go(-1));
    document.getElementById("nextBtn").addEventListener("click", () => go(1));
    document.getElementById("resetSeen").addEventListener("click", () => {
      const n = completed.size;
      if (n === 0) {
        alert("ℹ️ Nuk ka asnjë shenjë 'Rishikuar' për t'u fshirë.");
        return;
      }
      const warning =
        "⚠️ KUJDES — VEPRIM I PAKTHYESHËM ⚠️\n\n" +
        `Do të fshihen të GJITHA ${n} shenjat 'Rishikuar'.\n` +
        "I gjithë progresi juaj i rishikimit do të humbasë PËRGJITHMONË dhe\n" +
        "çdo respondent do të rishfaqet nga fillimi.\n\n" +
        "Ky veprim NUK mund të zhbëhet.\n\n" +
        "A jeni vërtet i/e sigurt që doni të vazhdoni?";
      if (!confirm(warning)) return;
      // Second, deliberate confirmation given the gravity of losing all progress.
      if (!confirm(`Konfirmim i fundit: të fshihen përfundimisht ${n} shenja 'Rishikuar'?`)) return;
      completed = new Set();
      saveCompleted();
      index = 0;
      recomputeView();
      render();
    });
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "SELECT") return;
      if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "ArrowRight") go(1);
      else if (e.key.toLowerCase() === "d") markDone();
    });

    fetch(DATA_URL)
      .then(r => { if (!r.ok) throw new Error(`Nuk u ngarkua ${DATA_URL}`); return r.json(); })
      .then(data => { records = data; setupFilters(); recomputeView(); render(); })
      .catch(err => {
        document.getElementById("cardSlot").innerHTML =
          `<section class="empty visible"><strong>${escapeHtml(err.message)}</strong>Shërbejeni këtë faqe përmes http (p.sh. <code>python -m http.server</code>) që shfletuesi të lexojë JSON-in.</section>`;
      });
  </script>
</body>
</html>
